name: driver_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.6
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  local_auth: ^2.3.0
  audioplayers: ^6.0.0
  easy_localization: ^3.0.8
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  google_maps_flutter: ^2.5.3
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true # Enabled code generation for localizations

  assets:
    - assets/images/
    - assets/sounds/
    - assets/translations/